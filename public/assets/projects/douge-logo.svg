  <title id="icon-title">拼豆岛图标</title>
  <desc id="icon-desc">一颗俯视拼豆，中央负形是一座海岛与波浪。</desc>
  <defs>
    <path id="island-shape" d="M160 86C184 86 195 108 205 130C215 150 239 152 253 170C271 194 260 223 232 237C191 257 134 254 96 231C70 216 69 187 87 169C100 156 119 151 128 132C140 106 146 86 160 86Z"/>
