# Temporary visitor preview on the server IP; domain/HTTPS remain separate.
# Add alongside existing virtual hosts. Do not make this the default server.
server {
    listen 80;
    server_name 49.234.27.200;
    server_tokens off;
    charset utf-8;
    client_max_body_size 1k;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No credentials, accounts, uploads or edits over the HTTP preview.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    error_page 403 /__sunlit_read_only;
    location = /__sunlit_read_only {
        internal;
        default_type text/html;
        return 403 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP 预览 · 日光之间</title><body style="margin:0;background:#edf3f7;color:#17374c;font-family:system-ui,sans-serif;line-height:1.8"><main style="max-width:32rem;margin:12vh auto;padding:24px"><p>日光之间 · IP 预览</p><h1 style="font-size:28px">这里先用来浏览。</h1><p>手机可以查看个人介绍、项目和随笔。管理、写作和上传请继续在电脑通过原来的 SSH 私有入口进行；域名 HTTPS 上线后再使用手机管理。</p><a href="/" style="color:#315f85">回到首页 →</a></main></body></html>';
    }

    location ~* ^/(admin|studio|api/admin)(/|$) { return 403; }

    location / {
        proxy_pass http://127.0.0.1:5183;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:5183;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
}
