# Production virtual hosts. Keep the separate visitor-only IP preview.
# Activate after ICP approval, DNS propagation and valid certificate issuance.
server {
    listen 80;
    server_name xiaofei03.ren www.xiaofei03.ren;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/sunlit-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://xiaofei03.ren$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.xiaofei03.ren;
    ssl_certificate /etc/letsencrypt/live/xiaofei03.ren/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaofei03.ren/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    return 308 https://xiaofei03.ren$request_uri;
}

server {
    listen 443 ssl;
    server_name xiaofei03.ren;
    ssl_certificate /etc/letsencrypt/live/xiaofei03.ren/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaofei03.ren/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
