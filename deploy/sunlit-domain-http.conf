# Activate only after the new website ICP approval and A records are verified.
# HTTP bootstrap for a webroot certificate. HTTPS replaces this file afterward.
server {
    listen 80;
    server_name xiaofei03.ren www.xiaofei03.ren;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/sunlit-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
